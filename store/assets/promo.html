<!doctype html>
<!-- Source for the promo tiles. Re-render with: node scripts/render-promo.mjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: var(--w); height: var(--h); overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: calc(var(--h) * 0.09);
    background: linear-gradient(135deg, #ff5f6d 0%, #c45cd8 55%, #7b5cff 100%);
    font-family: 'Google Sans', Inter, 'Segoe UI', system-ui, sans-serif; color: #fff;
  }
  img { width: calc(var(--h) * 0.48); height: auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.25)); }
  h1 { margin: 0; font-size: calc(var(--h) * 0.15); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  p { margin: calc(var(--h) * 0.04) 0 0; font-size: calc(var(--h) * 0.075); font-weight: 600; opacity: .95; line-height: 1.25; }
  .pills { display: flex; gap: 10px; margin-top: calc(var(--h) * 0.06); }
  .pill { font-size: calc(var(--h) * 0.05); font-weight: 700; padding: .35em .8em; border-radius: 999px; background: rgba(255,255,255,.2); }
  .small { gap: 20px; }
  .small img { width: 112px; }
  .small h1 { font-size: 38px; }
  .small p { font-size: 19px; }
  .small .pills { display: none; }
</style>
</head>
<body>
  <img src="../../icons/logo.png" alt="">
  <div>
    <h1>Swipe Photos</h1>
    <p>Swipe to clean up<br>Google Photos</p>
    <div class="pills"><span class="pill">✕ Trash</span><span class="pill">♥ Keep</span><span class="pill">↺ Undo</span></div>
  </div>
</body>
</html>
